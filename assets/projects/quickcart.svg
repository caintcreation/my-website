<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="qc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="qc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="900" height="550" fill="url(#qc-bg)" rx="16"/>
  <!-- Top Bar -->
  <rect width="900" height="56" fill="#134e4a" rx="16 16 0 0"/>
  <text x="32" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">⚡ QuickCart Studio &#8226; Multi-Tenant WhatsApp Storefront</text>
  <rect x="710" y="16" width="160" height="26" rx="13" fill="#22c55e"/>
  <text x="724" y="33" fill="#052e16" font-family="sans-serif" font-size="11" font-weight="800">CONNECT WHATSAPP API</text>

  <!-- Left: Storefront Preview -->
  <g filter="url(#qc-shadow)">
    <rect x="40" y="80" width="480" height="430" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="40" y="80" width="480" height="50" rx="12 12 0 0" fill="#1e293b"/>
    <text x="60" y="111" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Urban Trendz Boutique</text>
    <text x="440" y="111" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="700">OPEN NOW</text>

    <!-- Product 1 -->
    <rect x="60" y="150" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="70" y="160" width="180" height="70" rx="6" fill="#334155"/>
    <text x="135" y="200" fill="#94a3b8" font-family="sans-serif" font-size="12">Footwear Image</text>
    <text x="70" y="250" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Air Velocity Sneakers</text>
    <text x="70" y="275" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="700">KES 3,850</text>
    <rect x="180" y="260" width="70" height="24" rx="4" fill="#0284c7"/>
    <text x="195" y="276" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">+ ADD</text>

    <!-- Product 2 -->
    <rect x="280" y="150" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="290" y="160" width="200" height="70" rx="6" fill="#334155"/>
    <text x="365" y="200" fill="#94a3b8" font-family="sans-serif" font-size="12">Apparel Image</text>
    <text x="290" y="250" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Classic Denim Jacket</text>
    <text x="290" y="275" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="700">KES 2,400</text>
    <rect x="410" y="260" width="80" height="24" rx="4" fill="#0284c7"/>
    <text x="425" y="276" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">+ ADD</text>

    <!-- Cart Summary Row -->
    <rect x="60" y="320" width="440" height="60" rx="8" fill="#132a26" stroke="#22c55e" stroke-width="1"/>
    <text x="80" y="345" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Shopping Cart: 2 Items Selected</text>
    <text x="80" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12">Total: KES 6,250 &#8226; Ready to Order</text>
    <rect x="360" y="333" width="130" height="34" rx="6" fill="#22c55e"/>
    <text x="375" y="354" fill="#052e16" font-family="sans-serif" font-size="12" font-weight="800">ORDER ON WA ➔</text>

    <text x="60" y="420" fill="#64748b" font-family="sans-serif" font-size="12">✓ Real-time Inventory &#8226; ✓ Multi-Tenant Database &#8226; ✓ Zero Commission Fees</text>
  </g>

  <!-- Right: Generated WhatsApp Message Preview -->
  <g filter="url(#qc-shadow)">
    <rect x="550" y="80" width="310" height="430" rx="16" fill="#0b141a" stroke="#22c55e" stroke-width="1"/>
    <rect x="550" y="80" width="310" height="46" rx="16 16 0 0" fill="#1f2c34"/>
    <circle cx="575" cy="103" r="14" fill="#22c55e"/>
    <text x="598" y="102" fill="#e9edef" font-family="sans-serif" font-size="12" font-weight="700">Urban Trendz Orders</text>
    <text x="598" y="117" fill="#8696a0" font-family="sans-serif" font-size="10">Online</text>

    <!-- Bubble -->
    <rect x="568" y="145" width="274" height="230" rx="8" fill="#005c4b"/>
    <text x="580" y="170" fill="#e9edef" font-family="sans-serif" font-size="11" font-weight="700">🛍️ NEW ORDER #QC-9042</text>
    <text x="580" y="195" fill="#d1d7db" font-family="sans-serif" font-size="11">Customer: Grace Wanjiku</text>
    <text x="580" y="215" fill="#d1d7db" font-family="sans-serif" font-size="11">Phone: 0712 *** 890</text>
    <text x="580" y="235" fill="#d1d7db" font-family="sans-serif" font-size="11">Location: Westlands, Nairobi</text>
    <line x1="580" y1="245" x2="825" y2="245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="580" y="265" fill="#d1d7db" font-family="sans-serif" font-size="11">1x Air Velocity Sneakers (Size 41)</text>
    <text x="580" y="285" fill="#d1d7db" font-family="sans-serif" font-size="11">1x Classic Denim Jacket (Size M)</text>
    <text x="580" y="315" fill="#53bdeb" font-family="sans-serif" font-size="12" font-weight="800">Total: KES 6,250 [M-Pesa]</text>
    <text x="790" y="365" fill="#8696a0" font-family="sans-serif" font-size="10">10:42 AM ✓✓</text>

    <rect x="568" y="395" width="274" height="38" rx="8" fill="#1f2c34"/>
    <text x="615" y="419" fill="#25d366" font-family="sans-serif" font-size="12" font-weight="700">Direct to Merchant Phone</text>
  </g>
</svg>