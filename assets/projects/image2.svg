<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="rp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="rp-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="rp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="900" height="550" fill="url(#rp-bg)" rx="16"/>
  <!-- Window Header -->
  <rect width="900" height="48" fill="#1e293b" rx="16 16 0 0"/>
  <circle cx="32" cy="24" r="6" fill="#ef4444"/>
  <circle cx="52" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="24" r="6" fill="#10b981"/>
  <text x="110" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">ReviewPulse AI &#8226; Autonomous Review Intelligence Dashboard</text>
  <rect x="740" y="14" width="130" height="22" rx="11" fill="rgba(56,189,248,0.15)"/>
  <text x="752" y="29" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">● LIVE API CONNECTED</text>
  
  <!-- Sidebar -->
  <rect x="0" y="48" width="190" height="502" fill="#0f172a"/>
  <text x="24" y="85" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">CHANNELS</text>
  <rect x="16" y="100" width="158" height="36" rx="8" fill="rgba(56,189,248,0.1)"/>
  <text x="32" y="123" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">Inbox (14 New)</text>
  <text x="32" y="160" fill="#94a3b8" font-family="sans-serif" font-size="13">Processed Reviews</text>
  <text x="32" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">Sentiment Trends</text>
  <text x="32" y="230" fill="#94a3b8" font-family="sans-serif" font-size="13">AI Automation Rules</text>
  <text x="32" y="265" fill="#94a3b8" font-family="sans-serif" font-size="13">Webhooks &amp; API</text>
  
  <!-- Main Stats -->
  <rect x="220" y="70" width="150" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="236" y="94" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOTAL REVIEWS</text>
  <text x="236" y="126" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">2,845</text>
  
  <rect x="385" y="70" width="150" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="401" y="94" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">POSITIVE SENTIMENT</text>
  <text x="401" y="126" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="700">92.4%</text>

  <rect x="550" y="70" width="150" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="566" y="94" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">AVG RESPONSE TIME</text>
  <text x="566" y="126" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="700">&lt; 4 mins</text>

  <rect x="715" y="70" width="155" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="731" y="94" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">AUTO-DRAFTS SAVED</text>
  <text x="731" y="126" fill="#a855f7" font-family="sans-serif" font-size="24" font-weight="700">1,910</text>

  <!-- Review Card Under Inspection -->
  <g filter="url(#rp-shadow)">
    <rect x="220" y="160" width="650" height="360" rx="12" fill="#131c2e" stroke="#25354d" stroke-width="1"/>
    <!-- Top badge -->
    <rect x="244" y="180" width="85" height="24" rx="12" fill="rgba(16,185,129,0.15)"/>
    <text x="256" y="196" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">★ 5.0 RATING</text>
    <rect x="338" y="180" width="125" height="24" rx="12" fill="rgba(56,189,248,0.15)"/>
    <text x="348" y="196" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">POSITIVE SENTIMENT</text>
    <text x="780" y="196" fill="#64748b" font-family="sans-serif" font-size="12">12 mins ago</text>

    <!-- Review Text -->
    <text x="244" y="235" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="600">"The fastest checkout experience I have ever used in Nairobi!"</text>
    <text x="244" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13">"Received my order confirmation instantly on WhatsApp and payment processed via M-Pesa flawlessly."</text>
    
    <!-- AI Suggestion Box -->
    <rect x="244" y="285" width="602" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="256" y="297" width="130" height="20" rx="10" fill="url(#rp-accent)"/>
    <text x="266" y="311" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">AI RECOMMENDED REPLY</text>
    <text x="256" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="13">"Hi Kevin, thank you for your kind words! We are delighted that you enjoyed our instant M-Pesa</text>
    <text x="256" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="13">confirmation and WhatsApp updates. We look forward to serving you again soon!"</text>
    <text x="256" y="390" fill="#64748b" font-family="sans-serif" font-size="11">Confidence Score: 98.6% &#8226; Tone: Warm &amp; Professional &#8226; Model: Contextual LLM</text>

    <!-- Buttons -->
    <rect x="244" y="455" width="150" height="38" rx="8" fill="#38bdf8"/>
    <text x="268" y="479" fill="#090b10" font-family="sans-serif" font-size="13" font-weight="700">Approve &amp; Send</text>
    <rect x="410" y="455" width="130" height="38" rx="8" fill="#334155"/>
    <text x="442" y="479" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Edit Draft</text>
    <rect x="555" y="455" width="100" height="38" rx="8" fill="transparent" stroke="#475569" stroke-width="1"/>
    <text x="583" y="479" fill="#94a3b8" font-family="sans-serif" font-size="13">Dismiss</text>
  </g>
</svg>