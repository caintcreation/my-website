<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="gl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="900" height="550" fill="url(#gl-bg)" rx="16"/>
  <rect width="900" height="46" fill="#1e293b" rx="16 16 0 0"/>
  <text x="32" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Computer Graphics &amp; Algorithmic Simulation (C++ / FreeGLUT / OpenGL)</text>

  <!-- Viewport 1: Subpixel Subdivision -->
  <rect x="40" y="75" width="250" height="320" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">1. Subpixel Area Subdivision</text>
  <line x1="60" y1="130" x2="260" y2="280" stroke="#38bdf8" stroke-width="3"/>
  <rect x="70" y="160" width="130" height="90" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="55" y="340" fill="#94a3b8" font-family="sans-serif" font-size="11">Anti-aliasing subpixel grid</text>

  <!-- Viewport 2: Catmull's Object Precision -->
  <rect x="325" y="75" width="250" height="320" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="340" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">2. Catmull's Precision</text>
  <polygon points="450,150 530,280 370,280" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="450" cy="220" r="40" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="340" fill="#94a3b8" font-family="sans-serif" font-size="11">Analytical geometric clipping</text>

  <!-- Viewport 3: A-Buffer Transparency -->
  <rect x="610" y="75" width="250" height="320" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="625" y="105" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">3. A-Buffer Transparency</text>
  <rect x="640" y="150" width="120" height="90" fill="rgba(56,189,248,0.5)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="690" y="180" width="120" height="90" fill="rgba(244,63,94,0.5)" stroke="#f43f5e" stroke-width="2"/>
  <text x="625" y="340" fill="#94a3b8" font-family="sans-serif" font-size="11">Order-independent alpha blending</text>

  <!-- Bottom Panel -->
  <rect x="40" y="420" width="820" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="450" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Data Structures &amp; Systems Engineering</text>
  <text x="60" y="480" fill="#94a3b8" font-family="sans-serif" font-size="12">&#8226; C++ custom PROXMAN ascending sort implementation &#8226; Multi-viewport OpenGL / FreeGLUT window pipelines</text>
</svg>